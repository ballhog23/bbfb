name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  id-token: write   # needed for OIDC token request
  contents: read     # needed to checkout code

# run one deploy at a time. the app instance runs out of memory when two npm ci runs overlap
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the build to the deploy branch
    container:
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
    steps:
      - name: Install prerequisites
        run: dnf install -y tar gzip git libatomic

      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # the app instance is too small to build, so it pulls the built files from this branch.
      # each push replaces the branch with one commit, so built files do not pile up in the history
      - name: Push build to deploy branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STAGE=$(mktemp -d)
          cp -r dist public views drizzle.config.ts package.json package-lock.json "$STAGE"/
          # drizzle-kit migrate loads drizzle.config.ts, which needs these source files
          mkdir -p "$STAGE/src/db"
          cp src/config.ts "$STAGE/src/"
          cp -r src/db/schema.ts src/db/migrations "$STAGE/src/db/"
          cd "$STAGE"
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build from ${{ github.sha }}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy from commit ${{ github.sha }}" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/${{ secrets.APP_NAME }}",
              "sudo -u ${{ secrets.APP_NAME }} git fetch origin deploy",
              "sudo -u ${{ secrets.APP_NAME }} git checkout -f -B deploy origin/deploy",
              "sudo -u ${{ secrets.APP_NAME }} npm ci --omit=dev --no-audit --no-fund",
              "sudo -u ${{ secrets.APP_NAME }} npm run migrate",
              "sudo systemctl restart ${{ secrets.APP_NAME }}"
            ]' \
            --query "Command.CommandId" \
            --output text)

          # wait for the command to finish and check status
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "InProgress")

            echo "Attempt $i: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deploy succeeded"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deploy failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for deploy"
          exit 1
